# Le Sonar, page de vente

[build]
  publish = "."
  # Les notes internes du dépôt ne doivent pas être servies sur le site.
  command = "rm -f CLAUDE.md"

# Les images ne changent jamais une fois publiées : cache long.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La page, elle, doit toujours être fraîche après un déploiement.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
